# Credenciais de ambiente de estudo (as mesmas do docker-compose).
# O billing_user só tem GRANT no schema billing_db (ver k8s-infra/mysql).
apiVersion: v1
kind: Secret
metadata:
  name: billing-service-sec
  namespace: zm
type: Opaque
stringData:
  DATABASE_URL: "mysql+pymysql://billing_user:billing_pass@mysql:3306/billing_db"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/%2F"
