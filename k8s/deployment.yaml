# billing-service: orçamento, e-mail de aprovação, pagamento (mock Mercado Pago) e estorno.
# Participante da Saga: consome billing.commands e publica em os.events.
# A tag da imagem é trocada pelo SHA do commit no pipeline (sed no job de deploy).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: zm
  labels:
    app: billing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      imagePullSecrets:
        - name: dockerhub-credentials
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql 3306; do echo "aguardando mysql..."; sleep 2; done
              until nc -z rabbitmq 5672; do echo "aguardando rabbitmq..."; sleep 2; done
      containers:
        - name: billing-service
          image: jayakuza/zm-billing-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: billing-service-cfg
            - secretRef:
                name: billing-service-sec
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
